  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => { const z = {}; if ("x" in from) z.x = 0; if ("y" in from) z.y = 0; if ("scale" in from) z.scale = 1; return tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...z, ...to }, t); };
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      // L0 一堆数
      IN("#ca-head", at(0, 0.02), 0.8, { y: 20 });
      tl.fromTo("#ca-q text", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.25 }, at(0, 0.2));
      tl.to("#ca-q text", { opacity: 0, duration: 0.3, stagger: 0.05 }, L[1][0] + 0.05);

      // L1
      IN("#ca-inv", at(1, 0.05));
      tl.fromTo("#ca-bar", { attr: { width: 0 } }, { attr: { width: 1520 }, duration: 1.1, ease: "power2.out" }, at(1, 0.2));
      IN("#ca-alt", at(1, 0.65));

      // L2
      tl.fromTo("#ca-frz", { attr: { width: 0 } }, { attr: { width: 683 }, duration: 1.0, ease: "power2.out" }, at(2, 0.15));
      IN("#ca-frzl", at(2, 0.3));

      // L3–L5
      IN("#ca-c1", at(3, 0.1), 0.7, { y: 30 });
      IN("#ca-c2", at(4, 0.1), 0.7, { y: 30 });
      IN("#ca-c3", at(5, 0.05), 0.7, { y: 30 });
      IN("#ca-c4", at(5, 0.45), 0.7, { y: 30 });

      // L6
      IN("#ca-bad", at(6, 0.05));
      tl.to("#ca-bar", { opacity: 1, duration: 0.3, yoyo: true, repeat: 1 }, at(6, 0.1));
      DRAW("#ca-x", at(6, 0.55), 0.5);
      IN("#ca-xl", at(6, 0.62), 0.4, { x: -20 });

      // L7 冻结在变
      const d7 = L[7][1] - L[7][0];
      tl.to("#ca-frz", { attr: { width: 560 }, duration: d7 * 0.2, ease: "sine.inOut" }, at(7, 0.05));
      tl.to("#ca-frz", { attr: { width: 760 }, duration: d7 * 0.2, ease: "sine.inOut" }, at(7, 0.25));
      tl.to("#ca-frz", { attr: { width: 683 }, duration: d7 * 0.2, ease: "sine.inOut" }, at(7, 0.45));
      IN("#ca-why", at(7, 0.2));

      tl.to("#ca-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["caliber"] = tl;
    })();
