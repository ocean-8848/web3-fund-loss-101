<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>资损 101 Slides</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--surface2:#f5f7f9;--ink:#111823;--muted:#566170;--line:#d5dbe3;--accent:#2343c9;--accent-soft:#e3e8fb;--danger:#c2362d;--stage:#0f1117;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--surface:#151c25;--surface2:#1b2430;--ink:#e5eaf1;--muted:#9aa5b5;--line:#2b3644;--accent:#8fa2ff;--accent-soft:#1f2a52;--danger:#ff6e61;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1218;--surface:#151c25;--surface2:#1b2430;--ink:#e5eaf1;--muted:#9aa5b5;--line:#2b3644;--accent:#8fa2ff;--accent-soft:#1f2a52;--danger:#ff6e61;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;height:100vh;height:100dvh;overflow:hidden}
a{color:inherit}
#side{width:300px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
#side header{padding:14px 14px 8px}
#side h1{font-size:16px;margin:0 0 2px}#side h1 em{font-style:normal;color:var(--danger)}
#side .sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
#side .sub a{text-decoration:none;color:var(--accent)}
#q{margin:8px 14px;font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
#list{overflow:auto;padding:0 8px 16px;flex:1}
#list h2{font-size:12px;color:var(--muted);font-weight:600;margin:14px 8px 4px;letter-spacing:.04em}
.ch{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;cursor:pointer;text-decoration:none}
.ch:hover{background:var(--surface2)}
.ch b{min-width:34px;font-size:12px;color:var(--danger);font-weight:600}
.ch span{flex:1;min-width:0}
.ch small{color:var(--muted);font-size:11px;white-space:nowrap}
.ch.todo{opacity:.5}
.ch[aria-current]{background:var(--accent-soft)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px 12px}
#top{display:flex;gap:10px;align-items:center;margin-bottom:8px;min-height:32px}
#top h2{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top h2 b{color:var(--danger);margin-right:6px}
.btn{font:inherit;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#menu{display:none}
#pw{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:12px;background:var(--stage);cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--stage)}
#stage>.sc{display:none;position:absolute;inset:0}
#stage text{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#stage .mono,#stage .mono text{font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
#todo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#c9ccd3;font-size:18px;cursor:default}
#todo a{color:#8fa2ff}
#cap{margin:10px 0 6px;min-height:56px;font-size:19px;line-height:1.5;text-align:center;padding:0 8px;text-wrap:balance}
#scn{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
#scn button{font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
#scn button.on{border-color:var(--danger);color:var(--danger)}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
#bar input[type=range]{flex:1;min-width:120px;accent-color:var(--danger)}
#pn{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
select{font:inherit;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.keys{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
body.fs #side,body.fs #top,body.fs .keys{display:none}
body.fs #main{padding:8px}
body.snap #side,body.snap #top,body.snap #cap,body.snap #scn,body.snap #bar,body.snap .keys{display:none}
body.snap #main{padding:0}body.snap #pw{position:fixed;inset:0;border-radius:0}
@media (max-width:800px){
  body{display:block;overflow:auto;height:auto}
  #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}
  body.menu #side{transform:none;box-shadow:0 0 40px #0005}
  #menu{display:inline-block}
  #main{padding:10px 16px;min-height:100vh}
  #pw{flex:none;aspect-ratio:16/9}
  #cap{font-size:16px}
  .keys{display:none}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head><body>
<aside id="side">
  <header><h1>Web3 行业安全<em>资损</em> 101 · Slides</h1>
  <div class="sub"><span>看动画，快速过知识点</span><a href="index.html">← 回手册</a></div></header>
  <input id="q" type="search" placeholder="搜索章节：多签、预言机、G07" autocomplete="off">
  <nav id="list"></nav>
</aside>
<main id="main">
  <div id="top"><button class="btn" id="menu" type="button">☰ 章节</button><h2 id="ttl"></h2><a class="btn" id="src" href="index.html">读原文 ↗</a><button class="btn" id="fs" type="button" title="专注模式 (F)">⛶</button></div>
  <div id="pw"><div id="stage"></div><div id="todo"><div>本章 Slides 制作中</div><a id="todosrc" href="index.html">先读原文 →</a></div></div>
  <div id="cap"></div>
  <div id="scn"></div>
  <div id="bar">
    <button class="btn" id="pprev" type="button" title="上一页 (←)">◀</button><b id="pn"></b><button class="btn" id="pnext" type="button" title="下一页 (→ / 空格)">▶</button>
    <button class="btn" id="pplay" type="button" title="自动播放 (A)">⏵ 自动</button>
    <select id="sp" title="播放速度"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <input id="pr" type="range" min="0" max="1000" value="0" aria-label="进度">
    <button class="btn" id="cprev" type="button" title="上一章 (P)">⇤ 上一章</button><button class="btn" id="cnext" type="button" title="下一章 (N)">下一章 ⇥</button>
  </div>
  <div class="keys">← / → 翻页 · 空格下一页 · A 自动 · N / P 切章 · F 专注 · 点画面左侧 30% 后退</div>
</main>
<script>
const CH=/*DATA*/[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return localStorage.getItem("slides."+k)}catch(e){return null}},set(k,v){try{localStorage.setItem("slides."+k,v)}catch(e){}}};
let cur=-1,P=null,t=0,play=false,playTo=null,last=0,raf=0,speed=1;

function build(){
  const q=$("#q").value.trim().toLowerCase();let h="",g="";
  CH.forEach((c,i)=>{if(q&&!(c.code+" "+c.title+" "+(c.deck||"")).toLowerCase().includes(q))return;
    if(c.group!==g){g=c.group;h+=`<h2>${esc(g)}</h2>`}
    const n=c.scenes?c.scenes.reduce((a,s)=>a+s.lines.length,0):0;
    h+=`<a class="ch${n?"":" todo"}" href="#${c.id}" data-i="${i}"${i===cur?' aria-current="page"':""}><b>${c.code}</b><span>${esc(c.title)}</span><small>${n?n+" 页":"待制作"}</small></a>`});
  $("#list").innerHTML=h||'<p style="padding:8px;color:var(--muted)">没有匹配的章节</p>';
}
function fit(){const w=$("#pw"),k=Math.min(w.clientWidth/1920,w.clientHeight/1080);$("#stage").style.transform=`translate(${(w.clientWidth-1920*k)/2}px,${(w.clientHeight-1080*k)/2}px) scale(${k})`}

function open(i,page){
  i=(i+CH.length)%CH.length;const c=CH[i];
  if(i!==cur){
    cur=i;cancelAnimationFrame(raf);play=false;playTo=null;
    if(window.__timelines)Object.values(window.__timelines).forEach(tl=>tl.kill());
    window.__timelines={};const st=$("#stage");st.innerHTML="";P=null;
    $("#ttl").innerHTML=`<b>${c.code}</b>${esc(c.deck||c.title)}`;document.title=`${c.code} ${c.title} · 资损 101 Slides`;
    $("#src").href=$("#todosrc").href="index.html#"+c.id;
    if(c.scenes&&window.gsap){
      st.innerHTML=c.scenes.map(s=>`<div class="sc">${s.html}</div>`).join("");
      let s0=0;const sc=[],pages=[];
      c.scenes.forEach((s,si)=>{try{new Function(s.js)()}catch(e){console.error(s.id,e)}
        const el=st.children[si];sc.push({id:s.id,title:s.title,s:s0,d:s.d,el,tl:window.__timelines[s.id]});
        s.lines.forEach(([a,b,txt],li)=>{const end=li===s.lines.length-1?s.d-0.6:b;pages.push({t0:s0+a,t1:s0+Math.max(end,a+0.2)-0.02,txt,si})});
        s0+=s.d});
      P={sc,pages,dur:s0};
      $("#scn").innerHTML=sc.map((s,si)=>`<button type="button" data-si="${si}">${si+1}. ${esc(s.title)}</button>`).join("");
    }else $("#scn").innerHTML="";
    $("#todo").style.display=P?"none":"flex";
    if(c.scenes&&!window.gsap)$("#todo").firstElementChild.textContent="动画库 GSAP 没有加载（需要联网），先读原文";
    else $("#todo").firstElementChild.textContent="本章 Slides 制作中";
    build();const on=$(".ch[aria-current]");if(on)on.scrollIntoView({block:"nearest"});
    store.set("ch",c.id);fit();
  }
  document.body.classList.remove("menu");
  if(P){if(page==null){t=0;playTo=P.pages[0].t1;play=true;last=performance.now()}else{play=false;playTo=null;t=P.pages[Math.min(Math.max(page,0),P.pages.length-1)].t1}}
  tick();
}
function pageAt(x){let k=0;P.pages.forEach((p,i)=>{if(p.t0<=x+0.01)k=i});return k}
function goPage(d){if(!P)return;const k0=pageAt(t),k=Math.min(Math.max(k0+d,0),P.pages.length-1);
  if(d===1&&k!==k0){t=Math.max(t,P.pages[k].t0);playTo=P.pages[k].t1;play=true;last=performance.now()} // play the next line's animation
  else{play=false;playTo=null;t=P.pages[k].t1}
  if(!raf)tick()}
function goScene(si){if(!P)return;const k=P.pages.findIndex(p=>p.si===si);t=P.pages[k].t0;playTo=P.pages[k].t1;play=true;last=performance.now()}
function tick(){
  raf=0;if(!P){render0();return}
  const n=performance.now();
  if(play){t+=(n-last)/1000*speed;
    if(playTo!=null&&t>=playTo){t=playTo;play=false;playTo=null}
    if(t>=P.dur-0.6){t=P.dur-0.6;play=false;playTo=null}}
  last=n;
  let act=P.sc[P.sc.length-1];for(const s of P.sc)if(t>=s.s&&t<s.s+s.d){act=s;break}
  for(const s of P.sc){const on=s===act;s.el.style.display=on?"block":"none";if(on&&s.tl){s.tl.pause();s.tl.time(Math.min(Math.max(t-s.s,0),s.d))}}
  const k=pageAt(t),pg=P.pages[k];
  $("#pn").textContent=`${k+1} / ${P.pages.length}`;
  if($("#cap").textContent!==pg.txt)$("#cap").textContent=pg.txt;
  if(document.activeElement!==$("#pr"))$("#pr").value=t/P.dur*1000;
  $("#scn").querySelectorAll("button").forEach((b,i)=>b.classList.toggle("on",i===pg.si));
  const auto=play&&playTo==null;$("#pplay").textContent=auto?"⏸ 暂停":"⏵ 自动";$("#pplay").classList.toggle("on",auto);
  const h=`#${CH[cur].id}${k?"/"+(k+1):""}`;if(location.hash!==h)history.replaceState(null,"",h);
  if(play)raf=requestAnimationFrame(tick);
}
function render0(){$("#pn").textContent="– / –";$("#cap").textContent="";const h="#"+CH[cur].id;if(location.hash!==h)history.replaceState(null,"",h)}
function fromHash(){const m=location.hash.slice(1).split("/"),i=CH.findIndex(c=>c.id===m[0]);if(i<0)return false;open(i,m[1]?+m[1]-1:null);return true}

$("#q").oninput=build;
$("#list").onclick=e=>{const a=e.target.closest(".ch");if(!a)return;e.preventDefault();open(+a.dataset.i)};
$("#scn").onclick=e=>{const b=e.target.closest("button");if(b)goScene(+b.dataset.si)};
$("#pprev").onclick=()=>goPage(-1);$("#pnext").onclick=()=>goPage(1);
$("#cprev").onclick=()=>open(cur-1);$("#cnext").onclick=()=>open(cur+1);
$("#pplay").onclick=()=>{if(!P)return;if(play&&playTo==null){play=false}else{if(t>=P.dur-0.61)t=0;play=true;playTo=null;last=performance.now();tick()}tick()};
$("#sp").onchange=()=>{speed=+$("#sp").value;store.set("sp",speed)};
$("#pr").oninput=()=>{if(!P)return;play=false;playTo=null;t=$("#pr").value/1000*P.dur;tick()};
$("#pw").onclick=e=>{if(!P||e.target.closest("#todo"))return;const r=$("#pw").getBoundingClientRect();goPage(e.clientX-r.left<r.width*0.3?-1:1)};
$("#menu").onclick=()=>document.body.classList.toggle("menu");
$("#fs").onclick=()=>{document.body.classList.toggle("fs");fit()};
addEventListener("resize",fit);
addEventListener("hashchange",fromHash);
addEventListener("keydown",e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();
  if(k==="arrowright"||k==="pagedown"||k===" "){e.preventDefault();goPage(1)}
  else if(k==="arrowleft"||k==="pageup"){e.preventDefault();goPage(-1)}
  else if(k==="n")open(cur+1);else if(k==="p")open(cur-1);
  else if(k==="a")$("#pplay").click();else if(k==="f")$("#fs").click();
  else if(k==="escape"){document.body.classList.remove("fs","menu");fit()}});
if(/[?&]snap/.test(location.search)){document.body.classList.add("snap");store.set=()=>{}}
{const sp=+store.get("sp");if(sp){speed=sp;$("#sp").value=String(sp)}}
if(!fromHash()){const id=store.get("ch");let i=CH.findIndex(c=>c.id===id);if(i<0)i=Math.max(CH.findIndex(c=>c.scenes),0);open(i)}
</script>
</body></html>
