    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      const Q = (i, ln, f = 0.02) => { IN("#tz-n" + i, at(ln, f), 0.4); IN("#tz-q" + i, at(ln, f + 0.03), 0.6, { y: 16 }); };
      const NE = (i, t) => { OUT("#tz-eq" + i, t, 0.2); IN("#tz-ne" + i, t + 0.15, 0.4, { scale: 1.6, svgOrigin: "960 250" }, { scale: 1 }); };
      const CLR = (i, ln, extra = []) => ["#tz-n" + i, "#tz-q" + i, "#tz-ne" + i, "#tz-g" + i, ...extra].forEach(s => OUT(s, at(ln, 0.0), 0.3));

      // T1 币量 ≠ 美元
      Q(0, 0); NE(0, at(0, 0.55));
      IN("#tz-g0", at(1, 0.05), 0.6);
      tl.fromTo("#tz-g0 ellipse", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, immediateRender: false }, at(1, 0.05));

      // T2 冻结 ≠ 追回
      CLR(0, 2); Q(1, 2, 0.05); NE(1, at(2, 0.25)); IN("#tz-g1", at(2, 0.3), 0.6);

      // T3 补足 ≠ 没有损失
      CLR(1, 3); Q(2, 3, 0.05); NE(2, at(3, 0.25)); IN("#tz-g2", at(3, 0.2), 0.5);
      IN("#tz-loss", at(3, 0.3), 0.4);
      tl.to("#tz-lossm", { x: 680, duration: 0.9, ease: "power2.inOut" }, at(3, 0.45));

      // T4 初报 ≠ 最终
      CLR(2, 4, ["#tz-loss"]); Q(3, 4, 0.05); NE(3, at(4, 0.25));
      IN("#tz-g3", at(4, 0.3), 0.5);
      tl.to("#tz-bar", { attr: { width: 1000 }, duration: 0.8, ease: "power2.inOut" }, at(4, 0.55));
      IN("#tz-v2", at(4, 0.65), 0.4);
      IN("#tz-why", at(5, 0.1), 0.6);

      // T5 发现日 ≠ 发生日
      CLR(3, 6, ["#tz-v2", "#tz-why"]); Q(4, 6, 0.05); NE(4, at(6, 0.25));
      IN("#tz-g4", at(6, 0.25), 0.5);
      DRAW("#tz-span", at(6, 0.35), 0.9);
      IN("#tz-days", at(6, 0.55), 0.5);

      tl.to("#tz-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      
      window.__timelines["traps"] = tl;
    })();
