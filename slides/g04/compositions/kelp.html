  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0
      IN("#kp-term", at(0, 0.02));
      IN("#kp-head", at(0, 0.05), 0.8, { y: 16 });
      IN("#kp-msg", at(0, 0.25));
      ARROW("#kp-a1", at(0, 0.35), 0.5);
      IN("#kp-dvnb", at(0, 0.45));
      ARROW("#kp-a2", at(0, 0.55), 0.5);
      IN("#kp-rel", at(0, 0.65));

      // L1 RPC 被投毒
      IN("#kp-rpc", at(1, 0.05));
      ARROW("#kp-feed", at(1, 0.2), 0.5);
      tl.to("#kp-rpcr", { attr: { stroke: "#FC6255", fill: "#2a1616" }, duration: 0.4 }, at(1, 0.5));
      tl.to("#kp-feed", { attr: { stroke: "#FC6255", "marker-end": "url(#kp-arr2)" }, duration: 0.3 }, at(1, 0.5));
      IN("#kp-poi", at(1, 0.55));

      // L2 一个 = 全部
      tl.to("#kp-dvnr", { attr: { stroke: "#FC6255", fill: "#2a1616" }, duration: 0.5 }, at(2, 0.1));
      IN("#kp-all1", at(2, 0.3), 0.7, { y: 12 });

      // L3 伪造 burn 消息
      IN("#kp-fake", at(3, 0.02), 0.4);
      IN("#kp-fakel", at(3, 0.05));
      tl.to("#kp-fakeo", { keyframes: [{ x: 0, y: -230, duration: 0.3 }, { x: 650, y: -230, duration: 0.6 }, { x: 1300, y: -230, duration: 0.6 }], ease: "none" }, at(3, 0.15));
      tl.to("#kp-relr", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(3, 0.5));
      IN("#kp-num", at(3, 0.5), 0.3);
      COUNT("#kp-num", 0, 116500, at(3, 0.5), 1.0, v => Math.round(v).toLocaleString("en-US") + " rsETH");

      // L4 损失
      IN("#kp-loss", at(4, 0.1), 0.7, { y: 14 });

      // L5 依赖分开
      ["#kp-fakeo", "#kp-fakel", "#kp-num", "#kp-loss", "#kp-all1", "#kp-dvnb", "#kp-feed"].forEach(s => OUT(s, at(5, 0.0)));
      tl.to("#kp-relr", { attr: { stroke: "#F0B90B" }, duration: 0.3 }, at(5, 0.0));
      tl.fromTo(".kp-v", { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.15 }, at(5, 0.15));
      DRAW("#kp-feed3", at(5, 0.45), 0.3);
      IN("#kp-les", at(5, 0.55), 0.7, { y: 14 });

      tl.to("#kp-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#kp-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["kelp"] = tl;
    })();
  </script>
