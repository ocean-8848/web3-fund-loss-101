      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      // 第 5 位：首个证据标签（0 P,1 I,2 M,3 C）；第 6 位：带 C；第 7 位：层数空；第 8 位：归因“未知”开头

      const pos = k => [180 + (k % 24) * 40, 330 + Math.floor(k / 24) * 40];
      const gd = document.querySelector("#ev-dots");
      const dots = D.map((d, i) => { const p = pos(i); return mk("circle", { cx: p[0], cy: p[1], r: 13, fill: "#8a8f99", opacity: 0 }, gd); });

      const ord = D.map((d, i) => i).sort((a, b) => (+D[a][4]) - (+D[b][4]) || a - b);
      const rank = []; ord.forEach((i, k) => rank[i] = k);
      const EC = ["#83C167", "#58C4DD", "#8a8f99", "#FC6255"];
      const pick = f => dots.filter((c, i) => f(D[i]));

      // L0 图例
      IN("#ev-h0", at(0, 0.02));
      tl.fromTo(dots, { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.003, immediateRender: false }, at(0, 0.08));
      ["#ev-k0", "#ev-k1", "#ev-k2", "#ev-k3"].forEach((s, j) => IN(s, at(0, 0.2 + j * 0.13), 0.5, { x: 20 }));

      // L1 按首标签着色并归队
      dots.forEach((c, i) => { const p = pos(rank[i]); tl.to(c, { attr: { cx: p[0], cy: p[1], fill: EC[+D[i][4]] }, duration: 0.9, ease: "power2.inOut" }, at(1, 0.05) + (i % 30) * 0.01); });
      IN("#ev-cnl", at(1, 0.3)); IN("#ev-cn", at(1, 0.4), 0.6, { x: 20 });

      // L2 带 C 的 7 条

      tl.to(nonc, { opacity: 0.2, duration: 0.4 }, at(2, 0.05));
      tl.to(cdots, { attr: { stroke: "#FC6255", "stroke-width": 5, r: 15 }, duration: 0.4, ease: "back.out(2)" }, at(2, 0.1));
      IN("#ev-cc", at(2, 0.3));
