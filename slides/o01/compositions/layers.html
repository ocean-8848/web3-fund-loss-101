  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 列出每一步
      IN("#ly-head", at(0, 0.02), 0.6, { y: 16 });
      IN("#ly-atk", at(0, 0.12), 0.5);
      IN("#ly-ar", at(0, 0.15), 0.6);
      for (let k = 1; k <= 7; k++) IN("#ly-c" + k, at(0, 0.15 + k * 0.07), 0.45, { y: 16 });

      // L1 标信任域
      for (let k = 1; k <= 7; k++) IN("#ly-t" + k, at(1, 0.05 + k * 0.07), 0.4, { y: 10 });

      // L2 去掉两端
      IN("#ly-term", at(2, 0.02));
      IN("#ly-x", at(2, 0.2), 0.3, { scale: 1.3, svgOrigin: "960 525" }, { scale: 1 });
      tl.to("#ly-atk, #ly-c7, #ly-t7, #ly-x", { opacity: 0.22, duration: 0.5 }, at(2, 0.55));

      // L3 不同信任域计数
      DRAW("#ly-br", at(3, 0.03), 0.5);
      IN("#ly-brl", at(3, 0.1));
      tl.fromTo("#ly-nums g", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.3 }, at(3, 0.2));
      IN("#ly-tot", at(3, 0.55), 0.4);
      COUNT("#ly-n", 0, 5, at(3, 0.55), 0.6);

      // L4 比喻：门
      OUT("#ly-chain", at(4, 0.0), 0.4);
      OUT("#ly-term", at(4, 0.0), 0.4);
      for (let i = 0; i < 4; i++) IN("#ly-d" + i, at(4, 0.05 + i * 0.04), 0.4, { y: 16 });
      IN("#ly-ana", at(4, 0.08));
      IN("#ly-thief", at(4, 0.15), 0.3);
      const d4 = L[4][1] - L[4][0];
      tl.to("#ly-thief", { x: 1240, duration: d4 * 0.62, ease: "none" }, at(4, 0.18));
      tl.fromTo("#ly-eyes circle", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, stagger: d4 * 0.14 }, at(4, 0.26));
      IN("#ly-eyel", at(4, 0.7), 0.4);

      // L5 链上执行这扇门：几秒
      IN("#ly-d4", at(5, 0.05), 0.5, { y: 16 });
      tl.to("#ly-thief", { x: 1580, duration: 0.3, ease: "power2.in" }, at(5, 0.35));
      IN("#ly-fast", at(5, 0.45), 0.4, { scale: 1.3, svgOrigin: "1620 758" }, { scale: 1 });

      tl.to("#ly-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#ly-term", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["layers"] = tl;
    })();
