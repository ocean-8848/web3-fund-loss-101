    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      // L0 攻击者沿一串信任关系走向资金
      IN("#tr-atk", at(0, 0.02), 0.6, { scale: 0.6, svgOrigin: "150 720" }, { scale: 1 });
      for (let i = 0; i < 4; i++) {
        ARROW("#tr-a" + i, at(0, 0.12 + i * 0.13), 0.4);
        IN("#tr-c" + i, at(0, 0.18 + i * 0.13), 0.5, { y: 16 });
      }
      ARROW("#tr-a4", at(0, 0.66), 0.4);
      IN("#tr-fund", at(0, 0.72), 0.5, { scale: 0.6, svgOrigin: "1770 720" }, { scale: 1 });

      // L1 12 个信任域
      IN("#tr-head", at(1, 0.02));
      for (let i = 0; i < 12; i++) IN("#tr-g" + i, at(1, 0.08 + i * 0.035), 0.5, { y: -14 });
      ["#tr-gr0", "#tr-gr1", "#tr-gr2", "#tr-gr6"].forEach((s, k) =>
        tl.to(s, { attr: { stroke: "#e8e6df", "stroke-width": 4 }, duration: 0.4 }, at(1, 0.6 + k * 0.04)));

      // L2 每一跳都利用“上游已验证”
      const d2 = L[2][1] - L[2][0];
      IN("#tr-dot", at(2, 0.02), 0.2);
      tl.to("#tr-dot", { x: 1620, duration: d2 * 0.6, ease: "none" }, at(2, 0.05));
      IN("#tr-chk", at(2, 0.15), 0.6);
      IN("#tr-cap1", at(2, 0.3));
      OUT("#tr-dot", at(2, 0.66), 0.3);

      // L3 每一跳都是切断点
      OUT("#tr-chk", at(3, 0.0), 0.3);
      OUT("#tr-cap1", at(3, 0.0), 0.3);
      tl.fromTo("#tr-cut path", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.15, ease: "back.out(2)" }, at(3, 0.12));
      tl.to("#tr-a0, #tr-a1, #tr-a2, #tr-a3, #tr-a4", { opacity: 0.35, duration: 0.4 }, at(3, 0.15));
      IN("#tr-cap2", at(3, 0.4));

      tl.to("#tr-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["trust"] = tl;
