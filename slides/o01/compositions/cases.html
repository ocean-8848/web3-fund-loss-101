      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);

        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 32 起案件按层数堆起来
      IN("#cs-head", at(0, 0.02));
      IN("#cs-ax", at(0, 0.05), 0.5);
      tl.fromTo("#cs-all rect.qa, #cs-all rect.qb, #cs-all rect.qc", { opacity: 0, y: -30 }, { opacity: 0.85, y: 0, duration: 0.3, stagger: 0.06, ease: "power2.out" }, at(0, 0.1));
      COUNT("#cs-n", 0, 32, at(0, 0.1), 2.0);

      // L1 Bybit
      tl.to("#cs-q80", { attr: { fill: "#B48EF0" }, opacity: 1, duration: 0.4 }, at(1, 0.05));
      IN("#cs-byh", at(1, 0.1));
      tl.fromTo("#cs-by g, #cs-by path", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.12 }, at(1, 0.15));

      // L2 Wormhole / Euler
      tl.to("#cs-q21, #cs-q22", { attr: { fill: "#58C4DD" }, opacity: 1, duration: 0.4 }, at(2, 0.05));
      IN("#cs-whh", at(2, 0.1));
      tl.fromTo("#cs-wh g, #cs-wh path", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12 }, at(2, 0.15));

      tl.fromTo("#cs-eu g, #cs-eu path", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12 }, at(2, 0.4));

      tl.to("#cs-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["cases"] = tl;
