  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const MARK = (i, t) => tl.to("#st-r" + i, { attr: { "stroke-width": 6 }, duration: 0.25, yoyo: true, repeat: 1 }, t);

      // L0 六个方框依次出现
      IN("#st-head", at(0, 0.02), 0.7, { y: 16 });
      for (let i = 0; i < 6; i++) {
        IN("#st-b" + i, at(0, 0.12 + i * 0.1), 0.5, { y: 20 });
        if (i < 5) ARROW("#st-a" + i, at(0, 0.18 + i * 0.1), 0.25);
      }

      // L1–L4 逐阶段展开，红点跟着走
      IN("#st-dot", at(1, 0.02), 0.4, { scale: 0, svgOrigin: "210 262" }, { scale: 1 });
      IN("#st-d0", at(1, 0.15), 0.6, { y: -12 }); MARK(0, at(1, 0.1));
      [2, 3, 4].forEach((ln, k) => {
        const i = k + 1;
        tl.to("#st-dot", { x: i * 300, duration: 0.6, ease: "power2.inOut" }, at(ln, 0.02));
        MARK(i, at(ln, 0.15));
        IN("#st-d" + i, at(ln, 0.2), 0.6, { y: -12 });
      });

      // L5 链上执行 → 变现
      tl.to("#st-dot", { x: 1200, duration: 0.5, ease: "power2.inOut" }, at(5, 0.02));
      MARK(4, at(5, 0.1));
      IN("#st-d4", at(5, 0.15), 0.6, { y: -12 });
      tl.to("#st-dot", { x: 1500, duration: 0.5, ease: "power2.inOut" }, at(5, 0.45));
      MARK(5, at(5, 0.5));
      IN("#st-d5", at(5, 0.55), 0.6, { y: -12 });

      tl.to("#st-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["stages"] = tl;
