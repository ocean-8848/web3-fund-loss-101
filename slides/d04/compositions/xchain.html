      // L0 锁定 → 铸造

      ARROW("#xc-m1", at(0, 0.35), 0.3);
      IN("#xc-cb", at(0, 0.4)); ARROW("#xc-m2", at(0, 0.45), 0.3);

      OUT("#xc-val", at(1, 0.48), 0.3); OUT("#xc-vok", at(1, 0.48), 0.3); OUT("#xc-th", at(1, 0.48), 0.3); OUT("#xc-cap", at(1, 0.48), 0.3);

      IN("#xc-tx", at(2, 0.3)); IN("#xc-pool", at(2, 0.33));
      ARROW("#xc-b1", at(2, 0.4), 0.4); IN("#xc-b1l", at(2, 0.42)); IN("#xc-use", at(2, 0.45));
      ARROW("#xc-b2", at(2, 0.55), 0.4); IN("#xc-b2l", at(2, 0.57));
      IN("#xc-nc", at(2, 0.66));

      // L3 TWAP
      OUT("#xc-fl", at(3, 0.0), 0.4);
      TERM(3);

      DRAW("#xc-sp", at(3, 0.15), 1.0); IN("#xc-spl", at(3, 0.35));
      DRAW("#xc-tp", at(3, 0.45), 0.9); IN("#xc-tpl", at(3, 0.6));

      // L4 重组

      TERM(4);

      IN("#xc-txc", at(4, 0.15), 0.4);
      tl.fromTo("#xc-fork rect", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.1 }, at(4, 0.25));
      tl.fromTo("#xc-fl2 path", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, at(4, 0.25));

      IN("#xc-51", at(4, 0.62));
