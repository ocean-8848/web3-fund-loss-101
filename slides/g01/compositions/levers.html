  <!-- 场景 levers，id 前缀 lv- -->

        <!-- 坐标轴 -->
        <path id="lv-ax" class="dr" pathLength="1" d="M300 300 V820 H1560" stroke="#8a8f99" stroke-width="3" fill="none" />

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);

      // L0
      IN("#lv-head", at(0, 0.02), 0.8, { y: 20 });
      DRAW("#lv-ax", at(0, 0.1), 0.7);
      IN("#lv-axl", at(0, 0.2), 0.5);
      IN("#lv-in", at(0, 0.25), 0.5);
      DRAW("#lv-loss", at(0, 0.3), 1.2);
      IN("#lv-lossl", at(0, 0.55), 0.5);

      // L1 余额：越小，损失越早封顶
      IN("#lv-cap", at(1, 0.05), 0.5);
      tl.to("#lv-capg", { y: 180, duration: 1.0, ease: "power2.inOut" }, at(1, 0.3));
      tl.to("#lv-loss", { attr: { d: "M300 820 L650 640 L1500 640" }, duration: 1.0, ease: "power2.inOut" }, at(1, 0.3));
      tl.to("#lv-lossg", { y: 180, duration: 1.0, ease: "power2.inOut" }, at(1, 0.3));

      // L2 停签：越快，损失越小
      IN("#lv-stop", at(2, 0.05), 0.5, { x: 300 });
      tl.fromTo("#lv-stop", { x: 300 }, { x: 0, duration: 1.0, ease: "power2.inOut", immediateRender: false }, at(2, 0.05));
      tl.to("#lv-loss", { attr: { d: "M300 820 L500 717 L1500 717" }, duration: 1.0, ease: "power2.inOut" }, at(2, 0.05));
      tl.to("#lv-lossg", { y: 257, duration: 1.0, ease: "power2.inOut" }, at(2, 0.05));
      IN("#lv-span", at(2, 0.4), 0.5);

      // L3 与入口无关
      OUT("#lv-head", at(3, 0.0), 0.3);
      IN("#lv-f", at(3, 0.08), 0.7, { y: 15 });
      tl.to("#lv-in", { opacity: 0.4, duration: 0.4 }, at(3, 0.3));
      DRAW("#lv-inx", at(3, 0.35), 0.4);
      IN("#lv-fi", at(3, 0.45), 0.6);

      tl.to("#lv-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["levers"] = tl;
    })();
