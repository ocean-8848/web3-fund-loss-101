        <g id="sp-b3" class="h"><rect id="sp-r3" x="980" y="300" width="260" height="100" rx="14" fill="#161a22" stroke="#B48EF0" stroke-width="3" /><text x="1110" y="362" font-size="34" font-weight="700" fill="#B48EF0" text-anchor="middle">取得签名能力</text></g>
        <g id="sp-b4" class="h"><rect id="sp-r4" x="1280" y="300" width="260" height="100" rx="14" fill="#161a22" stroke="#58C4DD" stroke-width="3" /><text x="1410" y="362" font-size="34" font-weight="700" fill="#58C4DD" text-anchor="middle">链上执行</text></g>
        <g id="sp-b5" class="h"><rect id="sp-r5" x="1580" y="300" width="260" height="100" rx="14" fill="#161a22" stroke="#F0B90B" stroke-width="3" /><text x="1710" y="362" font-size="34" font-weight="700" fill="#F0B90B" text-anchor="middle">变现</text></g>
        <g id="sp-ar" class="h" stroke="#8a8f99" stroke-width="3"><path d="M344 350 H376" /><path d="M644 350 H676" /><path d="M944 350 H976" /><path d="M1244 350 H1276" /><path d="M1544 350 H1576" /></g>

  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const PULSE = (s, t, c) => tl.to(s, { attr: { "stroke-width": 7 }, duration: 0.3, yoyo: true, repeat: 1 }, t);

      // L0 六阶段 + 紫色全程路线
      for (let i = 0; i < 6; i++) IN("#sp-b" + i, at(0, 0.02 + i * 0.04), 0.4, { y: 14 });
      IN("#sp-ar", at(0, 0.2), 0.4);
      DRAW("#sp-route", at(0, 0.3), 1.2);
      tl.fromTo("#sp-rdots circle", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.18 }, at(0, 0.32));
      IN("#sp-rl", at(0, 0.55));

      // L1 合约类跳步
      ARROW("#sp-jump", at(1, 0.08), 0.9);
      IN("#sp-jl", at(1, 0.3));
      IN("#sp-jn", at(1, 0.45));
      tl.to("#sp-b1, #sp-b2", { opacity: 0.35, duration: 0.5 }, at(1, 0.5));

      // L2 代码缺陷本身就是放款权
      tl.to("#sp-r3", { attr: { stroke: "#58C4DD" }, duration: 0.4 }, at(2, 0.1));
      PULSE("#sp-r3", at(2, 0.1));
      IN("#sp-key", at(2, 0.3), 0.6, { x: -20 });

      // L3 链上执行很快
      tl.to("#sp-b1, #sp-b2", { opacity: 1, duration: 0.4 }, at(3, 0.0));
      tl.to("#sp-r4", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(3, 0.1));
      PULSE("#sp-r4", at(3, 0.1));
      IN("#sp-fast", at(3, 0.3), 0.4, { scale: 1.4, svgOrigin: "1410 525" }, { scale: 1 });

      // L4 检测 vs 熔断
      DRAW("#sp-br1", at(4, 0.05), 0.6);
      IN("#sp-slow", at(4, 0.2));
      DRAW("#sp-br2", at(4, 0.4), 0.5);
      IN("#sp-brk", at(4, 0.5));

      tl.to("#sp-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["speed"] = tl;
    })();
  </script>
