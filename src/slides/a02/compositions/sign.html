  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...to }, t);
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const TERM = (n) => { if (n > 0) OUT("#sg-t" + (n - 1), at(n, 0.0), 0.3); IN("#sg-t" + n, at(n, 0.05), 0.5, { x: -20 }); };

      // L0 私钥
      TERM(0);
      IN("#sg-seed", at(0, 0.05), 0.6);
      ARROW("#sg-a0", at(0, 0.15), 0.4); IN("#sg-a0l", at(0, 0.18), 0.4);
      IN("#sg-key", at(0, 0.22), 0.5, { scale: 0.6, svgOrigin: "782 376" }, { scale: 1 }); IN("#sg-keyl", at(0, 0.25));
      ARROW("#sg-a1", at(0, 0.32), 0.4); IN("#sg-a1l", at(0, 0.35), 0.4);
      IN("#sg-eoa", at(0, 0.38));
      tl.fromTo("#sg-coins circle", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.08 }, at(0, 0.42));
      ARROW("#sg-a2", at(0, 0.55), 0.4); IN("#sg-a2l", at(0, 0.57), 0.4);
      tl.to("#sg-coins circle", { x: 480, opacity: 0, duration: 0.6, stagger: 0.1, ease: "power2.in" }, at(0, 0.6));
      IN("#sg-kc", at(0, 0.7));

      // L1 盲签
      OUT("#sg-k", at(1, 0.0), 0.4);
      TERM(1);
      IN("#sg-hw", at(1, 0.1), 0.6, { y: 20 });
      IN("#sg-bl", at(1, 0.25));
      IN("#sg-tx", at(1, 0.35)); ARROW("#sg-txa", at(1, 0.45), 0.4);
      IN("#sg-bll", at(1, 0.55)); IN("#sg-bll2", at(1, 0.62));

      // L2 清晰签名
      TERM(2);
      OUT("#sg-bl", at(2, 0.05), 0.3); OUT("#sg-bll", at(2, 0.05), 0.3); OUT("#sg-bll2", at(2, 0.05), 0.3);
      OUT("#sg-tx", at(2, 0.05), 0.3); OUT("#sg-txa", at(2, 0.05), 0.3);
      tl.to("#sg-hwb", { attr: { stroke: "#83C167" }, duration: 0.4 }, at(2, 0.15));
      tl.fromTo("#sg-cl text", { opacity: 0, x: -15 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.2 }, at(2, 0.2));
      tl.set("#sg-cl", { opacity: 1 }, at(2, 0.2));
      IN("#sg-cll", at(2, 0.5)); IN("#sg-cll2", at(2, 0.58));

      // L3 多签
      OUT("#sg-dev", at(3, 0.0), 0.4);
      TERM(3);
      tl.fromTo("#sg-sig circle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, at(3, 0.08));
      IN("#sg-th", at(3, 0.2));
      tl.fromTo("#sg-chk path", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.2 }, at(3, 0.28));
      tl.fromTo("#sg-thf rect", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.2 }, at(3, 0.3));
      tl.fromTo("#sg-dep path", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, at(3, 0.55));
      IN("#sg-shared", at(3, 0.62));

      // L4 MPC
      OUT("#sg-ms", at(4, 0.0), 0.4);
      TERM(4);
      tl.fromTo("#sg-sh > g", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.12 }, at(4, 0.08));
      IN("#sg-mp1", at(4, 0.15));
      DRAW("#sg-ml path", at(4, 0.25), 0.5);
      IN("#sg-ms2", at(4, 0.32));
      IN("#sg-anytx", at(4, 0.42)); ARROW("#sg-ma", at(4, 0.48), 0.4);
      ARROW("#sg-mb", at(4, 0.56), 0.4); IN("#sg-mbl", at(4, 0.62));
      IN("#sg-mp2", at(4, 0.7), 0.5, { scale: 1.3, svgOrigin: "960 770" }, { scale: 1 });

      tl.to("#sg-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      tl.to("#sg-t4", { opacity: 0, duration: 0.3 }, C.d - 0.5);
      window.__timelines["sign"] = tl;
    })();
  </script>
