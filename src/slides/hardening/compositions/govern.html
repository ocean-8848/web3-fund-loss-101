      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });

      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // 节奏点：P0 12 个、P1 4 个、P2 1 个
      const NS = "http://www.w3.org/2000/svg";
      const dots = (sel, n, y) => { const g = document.querySelector(sel); for (let k = 0; k < n; k++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", 400 + (1300 / n) * (k + 0.5)); c.setAttribute("cy", y); c.setAttribute("r", 14); c.setAttribute("opacity", 0); g.appendChild(c); } };
      dots("#go-d0", 12, 400); dots("#go-d1", 4, 550); dots("#go-d2", 1, 700);

      // L0
      IN("#go-card", at(0, 0.05), 0.7, { y: 16 });
      IN("#go-stamp", at(0, 0.45), 0.35, { scale: 1.6, svgOrigin: "1250 440" }, { scale: 1, ease: "back.out(2)" });
      IN("#go-ev", at(0, 0.6));

      // L1 负责人
      OUT("#go-s0", at(1, 0.0), 0.4);
      IN("#go-not", at(1, 0.05));
      tl.fromTo("#go-o > g", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.25 }, at(1, 0.15));
      tl.fromTo("#go-oa path", { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.4, stagger: 0.25 }, at(1, 0.2));

      // L2 节奏

      IN("#go-yr", at(2, 0.05));
      IN("#go-r0", at(2, 0.1)); IN("#go-r1", at(2, 0.14)); IN("#go-r2", at(2, 0.18));
      tl.to("#go-d0 circle", { opacity: 1, duration: 0.15, stagger: 0.06 }, at(2, 0.22));
      tl.to("#go-d1 circle", { opacity: 1, duration: 0.15, stagger: 0.12 }, at(2, 0.4));
      tl.to("#go-d2 circle", { opacity: 1, duration: 0.2 }, at(2, 0.5));
      IN("#go-cad", at(2, 0.6));

      // L3 例外
      OUT("#go-s2", at(3, 0.0), 0.4);
      IN("#go-ph", at(3, 0.05));
      tl.to("#go-p0", { attr: { width: 500 }, duration: 0.5, ease: "none" }, at(3, 0.1)); IN("#go-pl0", at(3, 0.15));
      tl.to("#go-p1", { attr: { width: 500 }, duration: 0.5, ease: "none" }, at(3, 0.25)); IN("#go-pl1", at(3, 0.3));
      IN("#go-pl2", at(3, 0.45), 0.4);
      tl.to("#go-p2", { attr: { width: 520 }, duration: 0.5, ease: "none" }, at(3, 0.47));

      // L4 清单

      IN("#go-ch", at(4, 0.05), 0.6, { y: 16 });
      IN("#go-cl", at(4, 0.1));
      tl.fromTo("#go-bx > g", { opacity: 0 }, { opacity: 1, duration: 0.15, stagger: 0.07 }, at(4, 0.15));
      IN("#go-cn", at(4, 0.6));

      tl.to("#go-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
