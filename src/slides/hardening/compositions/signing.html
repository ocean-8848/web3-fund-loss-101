    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);

      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };
      const COUNT = (sel, from, to, t, d = 1.2, fmt = v => Math.round(v)) => {
        const o = { v: from }, el = document.querySelector(sel);
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => { el.textContent = fmt(o.v); } }, t);
      };

      // L0 MPC 只管钥匙
      IN("#si-biz", at(0, 0.03));
      ARROW("#si-a0", at(0, 0.12), 0.6);
      IN("#si-mpc", at(0, 0.2));
      ARROW("#si-a1", at(0, 0.3), 0.4);
      IN("#si-on", at(0, 0.34));
      IN("#si-what", at(0, 0.5), 0.6, { y: 10 });

      // L1 策略层
      IN("#si-pol", at(1, 0.05), 0.7, { scale: 0.85, svgOrigin: "800 420" });

      // L2 规则
      IN("#si-rules", at(2, 0.1), 0.7, { y: 12 });

      // L3 红队
      OUT("#si-what", at(3, 0.0), 0.3);
      tl.to("#si-bizr", { attr: { stroke: "#FC6255" }, duration: 0.3 }, at(3, 0.05));
      IN("#si-redl", at(3, 0.08));
      ARROW("#si-red", at(3, 0.15), 0.4);
      ARROW("#si-rej", at(3, 0.35), 0.4);
      IN("#si-rejl", at(3, 0.4));
      IN("#si-alert", at(3, 0.45));
      IN("#si-case1", at(3, 0.6));

      // L4 解码与哈希
      OUT("#si-chain", at(4, 0.0), 0.4);
      IN("#si-d1", at(4, 0.08), 0.6, { y: 16 });
      IN("#si-d2", at(4, 0.22), 0.6, { y: 16 });
      IN("#si-d3", at(4, 0.36), 0.6, { y: 16 });
      IN("#si-eq", at(4, 0.5), 0.4, { scale: 1.6, svgOrigin: "1260 340" });
      IN("#si-eql", at(4, 0.58));

      // L5 红旗
      IN("#si-flags", at(5, 0.05), 0.6, { y: 16 });
      IN("#si-stamp", at(5, 0.55), 0.35, { scale: 1.6, svgOrigin: "1560 730" }, { ease: "back.out(2)" });

      // L6 阈值
      OUT("#si-dec", at(6, 0.0), 0.4);
      IN("#si-msh", at(6, 0.06), 0.6, { y: 16 });
      IN("#si-msn", at(6, 0.12));
      IN("#si-bad", at(6, 0.2), 0.6);
      IN("#si-good", at(6, 0.45), 0.6);
      IN("#si-msc", at(6, 0.62));

      // L7 临时授权
      OUT("#si-ms", at(7, 0.0), 0.4);
      IN("#si-tmph", at(7, 0.06), 0.6, { y: 16 });
      DRAW("#si-tax", at(7, 0.1), 0.6);
      IN("#si-t0", at(7, 0.15));
      tl.to("#si-tb", { attr: { width: 800 }, duration: 0.9, ease: "none" }, at(7, 0.2));
      IN("#si-t1", at(7, 0.45), 0.4, { y: -10 });
      tl.to("#si-tb", { attr: { fill: "#9CDCEB" }, opacity: 0.35, duration: 0.4 }, at(7, 0.55));
      IN("#si-tc", at(7, 0.62));

      tl.to("#si-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["signing"] = tl;
    })();
