      const IN = (s, t, d = 0.7, from = {}, to = {}) => { const z = {}; if ("x" in from) z.x = 0; if ("y" in from) z.y = 0; if ("scale" in from) z.scale = 1; return tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...z, ...to }, t); };

      const ARROW = (s, t, d = 0.6) => { tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); DRAW(s, t, d); };

      const FOCUS = (keep, t) => { tl.to(ALL.filter(s => !keep.includes(s)).join(","), { opacity: 0.18, duration: 0.4 }, t); tl.to(keep.join(","), { opacity: 1, duration: 0.4 }, t); };

      // L0 六步
      ["#ch-n1", "#ch-n2", "#ch-n3", "#ch-n4", "#ch-n5", "#ch-n6"].forEach((s, k) => IN(s, at(0, 0.05 + k * 0.1), 0.5, { x: -20 }));

      // L1
      ARROW("#ch-la", at(1, 0.05), 0.9);
      IN("#ch-lal", at(1, 0.4), 0.5);

      // L2 预防

      IN("#ch-p1", at(2, 0.1), 0.5, { y: 20 }); IN("#ch-p2", at(2, 0.3), 0.5, { y: 20 }); IN("#ch-p3", at(2, 0.5), 0.5, { y: 20 });

      // L3 检测 + 止损
      IN("#ch-o", at(3, 0.05), 0.6, { y: 20 });
      IN("#ch-r1", at(3, 0.4), 0.5, { y: -20 });

      // L4 追回 + 楔形
      IN("#ch-r2", at(4, 0.05), 0.5, { y: -20 });
      IN("#ch-w", at(4, 0.35), 0.7);

      // L5 原型 A
      FOCUS(["#ch-n1", "#ch-n2", "#ch-n3", "#ch-n4", "#ch-p1", "#ch-p2", "#ch-r1"], at(5, 0.05));
      IN("#ch-ta", at(5, 0.15), 0.5, { x: -20 });

      // L6 原型 B / C
      OUT("#ch-ta", at(6, 0.0), 0.3);
      FOCUS(["#ch-n5", "#ch-p3", "#ch-r1"], at(6, 0.05));
      IN("#ch-tb", at(6, 0.15), 0.5, { x: -20 });
      IN("#ch-tc", at(6, 0.5), 0.5, { x: -20 });

      // L7 不依赖入口
      OUT("#ch-tb", at(7, 0.0), 0.3); OUT("#ch-tc", at(7, 0.0), 0.3);
      FOCUS(["#ch-p2", "#ch-r1"], at(7, 0.05));
      IN("#ch-td", at(7, 0.3), 0.5, { x: -20 });
      IN("#ch-q", at(7, 0.45), 0.4, { y: -10 });

      tl.to("#ch-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["chain"] = tl;
