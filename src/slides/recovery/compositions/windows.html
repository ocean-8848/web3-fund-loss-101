  <script>
    (function () {
      const C = /*CUES*/{}/*END*/;
      const L = C.L, at = (i, f = 0) => L[i][0] + f * (L[i][1] - L[i][0]);
      const tl = gsap.timeline({ paused: true });
      const IN = (s, t, d = 0.7, from = {}, to = {}) => { const z = {}; if ("x" in from) z.x = 0; if ("y" in from) z.y = 0; if ("scale" in from) z.scale = 1; return tl.fromTo(s, { opacity: 0, ...from }, { opacity: 1, duration: d, ease: "power3.out", ...z, ...to }, t); };
      const OUT = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
      const DRAW = (s, t, d = 0.8) => tl.fromTo(s, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
      const CLOSE = (i, t) => {
        tl.to(".wn-cb" + i, { attr: { stroke: "#3a4050", fill: "#161a22" }, duration: 0.4 }, t);
        tl.to(".wn-ct" + i, { attr: { fill: "#5a5f69" }, duration: 0.4 }, t);
      };

      // L0 时间轴
      IN("#wn-title", at(0, 0.02), 0.8, { y: 20 });
      DRAW("#wn-ax", at(0, 0.1), 0.8); IN("#wn-tk", at(0, 0.2));
      tl.fromTo(["#wn-l0", "#wn-l1", "#wn-l2", "#wn-l3"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.12 }, at(0, 0.25));
      IN("#wn-coin", at(0, 0.45), 0.5);
      IN("#wn-rh1", at(0, 0.5)); IN("#wn-rh2", at(0, 0.5));
      IN("#wn-hint", at(0, 0.6), 0.7, { y: 15 });

      // L1–L4 资金往前走，窗口逐个关闭
      OUT("#wn-hint", at(1, 0));
      for (let i = 0; i < 4; i++) {
        const n = i + 1;
        if (i > 0) CLOSE(i - 1, at(n, 0));
        tl.to("#wn-coin", { x: 400 * (i + 1), duration: 1.0, ease: "power2.inOut" }, at(n, 0.05));
        tl.to("#wn-prog", { attr: { width: 400 * (i + 1) }, duration: 1.0, ease: "power2.inOut" }, at(n, 0.05));
        IN("#wn-a" + i, at(n, 0.15), 0.6, { y: -10 });
        IN("#wn-c" + i, at(n, 0.4), 0.6, { y: 15 });
      }

      // L5 比喻
      tl.fromTo(".wn-an", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.15 }, at(5, 0.05));
      IN("#wn-lim", at(5, 0.45), 0.7, { y: 15 });

      tl.to("#wn-all", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, C.d - 0.5);
      window.__timelines["windows"] = tl;
    })();
